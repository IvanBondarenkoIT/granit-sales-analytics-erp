{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% trans "Granit Sales Analytics ERP" %}{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
        }
        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 0.75rem;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem 0;
        }
        .lang-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: #555;
        }
        .lang-switch select {
            padding: 0.35rem 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            font: inherit;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        footer {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-size: 0.875rem;
        }
        footer a { color: #5568d3; }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="topbar">
        <form class="lang-switch" action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.get_full_path }}">
            <label for="language">{% trans "Language" %}</label>
            <select name="language" id="language" onchange="this.form.submit()">
                {% get_current_language as CURRENT_LANGUAGE %}
                {% get_available_languages as AVAILABLE_LANGUAGES %}
                {% get_language_info_list for AVAILABLE_LANGUAGES as languages %}
                {% for language in languages %}
                    <option value="{{ language.code }}"{% if language.code == CURRENT_LANGUAGE %} selected{% endif %}>
                        {{ language.name_local }}
                    </option>
                {% endfor %}
            </select>
        </form>
    </div>

    {% block content %}{% endblock %}

    <footer>
        <p>
            {% trans "Granit Sales Analytics ERP" %}
            |
            <a href="{% url 'admin:index' %}">{% trans "Admin Panel" %}</a>
        </p>
    </footer>
</body>
</html>
